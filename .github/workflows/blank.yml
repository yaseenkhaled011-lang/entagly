<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251c">
  <meta name="description" content="ENTAGLY - مونتاج فيديوهات احترافي، ريلز وإعلانات وصناعة محتوى بأسعار مناسبة.">
  <title>ENTAGLY | انتجلي - مونتاج وصناعة محتوى</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1711;
      --surface: #13251b;
      --green: #75d69a;
      --text: #f4fff7;
      --muted: #b7c8bc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 23, 17, .95);
      border-bottom: 1px solid #263b2d;
      backdrop-filter: blur(10px);
    }

    nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 0;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: 1px;
    }

    .logo span {
      display: block;
      font-size: 13px;
      color: white;
      letter-spacing: 0;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .nav-links a:hover { color: var(--green); }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--green);
      color: #10251a;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-outline {
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
    }

    .hero {
      padding: 90px 0;
      text-align: center;
      background:
        radial-gradient(ellipse at top, #244a32 0%, transparent 65%);
    }

    .tag {
      display: inline-block;
      padding: 5px 14px;
      border: 1px solid #41694e;
      border-radius: 30px;
      color: var(--green);
      font-size: 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1.3;
      margin-bottom: 20px;
      font-weight: 900;
    }

    h1 span, .green { color: var(--green); }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto 28px;
      font-size: 17px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    section { padding: 65px 0; }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: clamp(26px, 5vw, 38px);
      margin-bottom: 8px;
    }

    .section-title p { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid #294132;
      border-radius: 18px;
      padding: 25px;
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--green);
    }

    .card .emoji {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .price {
      font-size: 30px;
      font-weight: 900;
      color: var(--green);
    }

    .price small {
      font-size: 14px;
      color: var(--muted);
    }

    .note {
      text-align: center;
      color: var(--muted);
      margin-top: 20px;
      font-size: 14px;
    }

    .feature {
      background: #102017;
      border-top: 1px solid #223a2a;
      border-bottom: 1px solid #223a2a;
    }

    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .feature-item {
      padding: 18px;
      border-right: 3px solid var(--green);
      background: #14281c;
      border-radius: 10px;
    }

    .feature-item p {
      color: var(--muted);
      font-size: 14px;
