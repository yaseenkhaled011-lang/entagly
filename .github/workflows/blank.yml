      text-align: center;
      color: var(--muted);
      border-top: 1px solid #263b2d;
      font-size: 13px;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      left: 18px;
      z-index: 20;
      background: #25d366;
      color: #fff;
      padding: 12px 17px;
      border-radius: 50px;
      font-weight: 800;
      box-shadow: 0 5px 20px #0006;
    }

    @media (max-width: 600px) {
      nav { justify-content: center; }
      .nav-links { justify-content: center; }
      .hero { padding: 65px 0; }
      section { padding: 48px 0; }
    }
  </style>
</head>

